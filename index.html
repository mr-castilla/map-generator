<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Generator — Grade 6 Humanities</title>
<style>
:root{--ink:#18313a;--muted:#64757c;--paper:#fff;--panel:#f5f7f6;--line:#d8e0dd;--accent:#176b66;--act:#f6d85c;--shop:#edf0e8;--living:#b9acd7;--water:#bfe3ea;--grass:#a9d875;--woods:#247b4d;--path:#ef9b32;--road:#d7d9d7;--bike:#f3d83f}
*{box-sizing:border-box} body{margin:0;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:#eef2f0}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:end;justify-content:space-between;gap:20px}
h1{margin:0;font-size:26px;letter-spacing:.03em}.sub{color:var(--muted);font-weight:700}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;padding:18px;max-width:1500px;margin:auto}
.controls,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px #0000000b}
.controls{padding:16px;align-self:start;position:sticky;top:12px}.controls h2{font-size:15px;margin:0 0 12px}
label{display:block;font-weight:700;margin:12px 0 5px}select,button{width:100%;border:1px solid #bcc9c5;border-radius:9px;padding:9px;background:#fff;color:var(--ink);font:inherit}
button{cursor:pointer;font-weight:800}.primary{background:var(--accent);color:white;border-color:var(--accent);margin-top:10px}.secondary{margin-top:8px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.skills label{font-weight:600;margin:0;font-size:12px;display:flex;gap:5px;align-items:center}.skills input{margin:0}
.tabs{display:flex;gap:7px;margin:14px 0 0}.tabs button{width:auto;padding:7px 10px}.tabs .on{background:#e3f1ef;border-color:#8bbdb7}
.main{min-width:0}.card{padding:16px}.worksheet-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.worksheet-head h2{margin:0;font-size:19px}.student-lines{color:#53656c}
.map-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.map-wrap svg{display:block;width:100%;height:auto;min-width:680px}
.questions{margin-top:16px}.q{padding:9px 11px;border-bottom:1px solid #e7ecea}.answer{font-weight:800;color:#176b66;margin-top:3px}.hidden{display:none!important}
.small{font-size:12px;color:var(--muted);margin-top:9px}
@media(max-width:900px){.app{grid-template-columns:1fr}.controls{position:static}}
@page{size:A4 portrait;margin:10mm}
@media print{
 body{background:white}.controls,header,.no-print{display:none!important}.app{display:block;padding:0}.card{border:0;box-shadow:none;padding:0}.map-wrap{border:0;overflow:visible}
 .map-wrap svg{min-width:0;width:100%}.q{break-inside:avoid;padding:5px 0;font-size:11pt}.worksheet-head{margin-bottom:4mm}
}
</style>
</head>
<body>
<header><div><h1>MAP GENERATOR</h1><div class="sub">Grade 6 Humanities</div></div><div class="sub">Data-driven • Printable • Offline</div></header>
<div class="app">
<aside class="controls">
<h2>Teacher Controls</h2>
<label>Difficulty</label><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select>
<label>Questions</label><select id="qcount"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
<label>Scale</label><select id="scale"><option value="auto">Automatic</option><option value="10">1 cm = 10 m</option><option value="20">1 cm = 20 m</option><option value="50">1 cm = 50 m</option></select>
<label>Skills</label>
<div class="skills">
<label><input type="checkbox" data-skill="grid" checked> Grid</label>
<label><input type="checkbox" data-skill="direction" checked> Directions</label>
<label><input type="checkbox" data-skill="distance" checked> Scale</label>
<label><input type="checkbox" data-skill="route" checked> Routes</label>
<label><input type="checkbox" data-skill="legend" checked> Legend</label>
<label><input type="checkbox" data-skill="interpret" checked> Interpretation</label>
</div>
<button class="primary" id="newMap">GENERATE NEW MAP</button>
<button class="secondary" id="newQs">GENERATE QUESTIONS</button>
<div class="tabs"><button id="studentTab" class="on">Student</button><button id="teacherTab">Answer Key</button></div>
<button class="secondary" id="printStudent">PRINT STUDENT WORKSHEET</button>
<button class="secondary" id="printTeacher">PRINT ANSWER KEY</button>
<div class="small">Tip: Generate Questions keeps the same map and creates a new question set.</div>
</aside>
<main class="main">
<section class="card" id="sheet">
<div class="worksheet-head"><div><h2 id="sheetTitle">Map Skills Worksheet</h2><div id="themeLine" class="sub"></div></div><div class="student-lines" id="studentLines">Name: ____________________ &nbsp; Date: __________</div></div>
<div class="map-wrap" id="map"></div>
<div class="questions" id="questions"></div>
</section>
</main>
</div>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const W=800,H=1000,CW=100,CH=100, letters="ABCDEFGH";
const libs={
 activity:["Swimming Pool","Tennis Courts","Gym","Bowling Alley","Playground","Skate Park","Sports Centre","Football Field","Basketball Court","Climbing Centre","Riding School","Adventure Park","Mini Golf"],
 shop:["Café","Restaurant","Pizza Place","Ice Cream Shop","Sports Shop","Gift Shop","Supermarket","Bakery","Bike Shop"],
 living:["Hostel","Hotel","Cottages","Campsite","Cabins","Visitor Lodge"],
 service:["Car Park","Main Gate","Bike Hire","Boat Hire","Visitor Centre","Bus Stop"],
 natural:["Lake","Duck Pond","Meadow","Hill","Picnic Park"],
 other:["Fountain","Bandstand","Picnic Area"]
};
const catColor={activity:"#f6d85c",shop:"#edf0e8",living:"#b9acd7",service:"#d8e1df",natural:"#bfe3ea",other:"#e8e4bb"};
let state={features:[],nodes:[],edges:[],questions:[],teacher:false,scale:20,seed:0};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pick=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>a.slice().sort(()=>Math.random()-.5);
function svgEl(n,a={}){let e=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function gridOf(x,y){return letters[Math.max(0,Math.min(7,Math.floor(x/CW)))]+(10-Math.max(0,Math.min(9,Math.floor(y/CH))))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function direction(a,b,cardinalOnly=false){
 let dx=b.x-a.x, dy=a.y-b.y; // positive dy = north
 let ang=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
 if(cardinalOnly){return ang<45||ang>=315?"E":ang<135?"N":ang<225?"W":"S"}
 const dirs=["E","NE","N","NW","W","SW","S","SE"]; return dirs[Math.round(ang/45)%8];
}
function uniqueNames(count){
 let pool=[...libs.activity,...libs.shop,...libs.living,...libs.service,...libs.natural,...libs.other];
 return shuffle(pool).slice(0,count);
}
function categoryFor(n){for(const[k,a]of Object.entries(libs))if(a.includes(n))return k;return"other"}
const sizeProfiles={
 "Football Field":{w:150,h:82,size:"veryLarge",shape:"field"},"Adventure Park":{w:135,h:82,size:"veryLarge",shape:"area"},"Campsite":{w:145,h:90,size:"veryLarge",shape:"campsite"},"Car Park":{w:145,h:82,size:"veryLarge",shape:"parking"},
 "Hotel":{w:112,h:70,size:"large"},"Hostel":{w:105,h:68,size:"large"},"Sports Centre":{w:120,h:72,size:"large"},"Swimming Pool":{w:125,h:76,size:"large",shape:"pool"},"Tennis Courts":{w:128,h:76,size:"large",shape:"tennis"},"Playground":{w:112,h:70,size:"large",shape:"area"},"Skate Park":{w:110,h:68,size:"large",shape:"area"},"Riding School":{w:115,h:70,size:"large"},
 "Restaurant":{w:88,h:58,size:"medium"},"Visitor Centre":{w:96,h:60,size:"medium"},"Gym":{w:86,h:56,size:"medium"},"Bowling Alley":{w:98,h:58,size:"medium"},"Cottages":{w:108,h:70,size:"medium",shape:"cluster"},"Cabins":{w:100,h:66,size:"medium",shape:"cluster"},"Supermarket":{w:96,h:58,size:"medium"},"Climbing Centre":{w:98,h:60,size:"medium"},
 "Café":{w:62,h:44,size:"small"},"Bakery":{w:66,h:44,size:"small"},"Gift Shop":{w:68,h:45,size:"small"},"Sports Shop":{w:72,h:46,size:"small"},"Bike Shop":{w:68,h:45,size:"small"},"Bike Hire":{w:66,h:44,size:"small"},"Boat Hire":{w:66,h:44,size:"small"},"Ice Cream Shop":{w:72,h:48,size:"small"},"Bus Stop":{w:58,h:40,size:"small"},
 "Main Gate":{w:76,h:42,size:"small"},"Pizza Place":{w:76,h:48,size:"small"},"Mini Golf":{w:100,h:62,size:"medium",shape:"area"},"Basketball Court":{w:112,h:68,size:"large",shape:"field"},"Picnic Park":{w:92,h:58,size:"medium"},"Picnic Area":{w:90,h:56,size:"medium"},"Bandstand":{w:72,h:50,size:"small"},"Fountain":{w:58,h:58,size:"small",shape:"round"},"Lake":{w:100,h:70,size:"large",shape:"round"},"Duck Pond":{w:90,h:62,size:"medium",shape:"round"},"Meadow":{w:94,h:58,size:"medium",shape:"round"},"Hill":{w:84,h:54,size:"medium",shape:"round"}
};
function profileFor(name){return sizeProfiles[name]||{w:82,h:52,size:"medium"}}
function labelLayout(name,w,h,size){
 const max=size==='large'||size==='veryLarge'?14:size==='small'?11:12, min=8, pad=10, words=name.split(/\\s+/);
 for(let fs=max;fs>=min;fs--){
   const cap=Math.max(4,Math.floor((w-pad*2)/(fs*.58))), maxLines=Math.max(1,Math.floor((h-pad*2)/(fs*1.15)));
   let lines=[],line=''; for(const word of words){let test=line?line+' '+word:word;if(test.length<=cap)line=test;else{if(line)lines.push(line);line=word}} if(line)lines.push(line);
   if(lines.length<=Math.min(3,maxLines)&&lines.every(x=>x.length<=cap))return{fs,lines};
 }
 return{fs:min,lines:words.length>1?[words.slice(0,Math.ceil(words.length/2)).join(' '),words.slice(Math.ceil(words.length/2)).join(' ')]:words};
}
function zoneCenters(){
 const layouts=[
  {activity:[250,300],shop:[340,520],living:[650,500],service:[430,850],water:[660,180]},
  {activity:[430,260],shop:[560,470],living:[650,760],service:[150,560],water:[170,820]},
  {activity:[610,470],shop:[390,470],living:[180,220],service:[170,850],water:[650,180]},
  {activity:[250,650],shop:[420,430],living:[650,300],service:[610,850],water:[150,180]}
 ]; return pick(layouts);
}
function nearGridCenter(v,size){let c=Math.floor(v/size)*size+size/2;return c+(Math.random()*24-12)}
function pointInWater(x,y,waters){return waters.some(w=>Math.hypot((x-w.x)/w.rx,(y-w.y)/w.ry)<1.15)}
function generate(){
 state.seed=Math.random(); state.features=[]; state.nodes=[]; state.edges=[]; state.questions=[];
 state.zones=zoneCenters(); state.waters=[]; state.woods=[]; state.road=[]; state.mainPaths=[]; state.bikePath=[];
 let scaleSel=$("#scale").value; state.scale=scaleSel==="auto"?pick([10,20,50]):+scaleSel;
 // Terrain first
 let wz=state.zones.water; state.waters.push({x:wz[0],y:wz[1],rx:95+Math.random()*35,ry:75+Math.random()*30});
 if(Math.random()<.45){let x=wz[0]<400?680:120,y=wz[1]<500?780:180;state.waters.push({x,y,rx:55+Math.random()*25,ry:45+Math.random()*20})}
 const woodPatterns=[[[0,0,120,330],[680,690,120,310]],[[0,0,800,90],[0,650,100,350]],[[690,0,110,360],[0,760,230,240]],[[0,0,100,1000],[650,0,150,180]]]; state.woods=pick(woodPatterns);
 buildRoad(); buildMainNetwork(); placeFacilities(); connectFacilities(); buildBikeTrail(); render(); generateQuestions();
}
function buildRoad(){
 let gate=state.zones.service, gx=nearGridCenter(gate[0],100), gy=950;
 let mid={x:nearGridCenter((gx+400)/2,100),y:nearGridCenter(700,100)};
 let end={x:nearGridCenter(420,100),y:nearGridCenter(520,100)};
 state.road=[{x:gx,y:1000},{x:gx,y:gy},{x:mid.x,y:mid.y},{x:end.x,y:end.y}];
}
function addNode(x,y,kind='path'){let id=state.nodes.length;state.nodes.push({id,x,y,feature:null,kind});return id}
function addEdge(a,b,kind='path'){state.edges.push({a,b,kind})}
function buildMainNetwork(){
 state.nodes=[];state.edges=[];state.mainPaths=[];
 // A connected backbone with distributed junctions; degree never exceeds 4.
 const templates=[
  [[70,600],[210,560],[340,610],[470,540],[610,500],[750,420]],
  [[80,350],[220,410],[350,390],[500,450],[650,390],[760,300]],
  [[80,700],[210,650],[350,690],[490,620],[620,660],[750,600]]
 ];
 let base=pick(templates).map(([x,y])=>({x:x+(Math.random()*24-12),y:y+(Math.random()*24-12)}));
 let ids=base.map(p=>addNode(p.x,p.y,'junction')); for(let i=0;i<ids.length-1;i++)addEdge(ids[i],ids[i+1]); state.mainPaths.push(ids);
 // north-south route intersects backbone at two distributed junctions by sharing nodes
 let j1=ids[1+Math.floor(Math.random()*2)], j2=ids[3+Math.floor(Math.random()*2)];
 let a=addNode(state.nodes[j1].x-55,80), b=addNode(state.nodes[j1].x-25,230), c=addNode(state.nodes[j2].x+25,790), d=addNode(state.nodes[j2].x+45,940);
 addEdge(a,b);addEdge(b,j1); addEdge(j1,j2); addEdge(j2,c);addEdge(c,d); state.mainPaths.push([a,b,j1,j2,c,d]);
 // one branch route, attached away from the same central point
 let attach=ids[pick([2,3,4])], p=state.nodes[attach]; let q1=addNode(Math.max(70,Math.min(730,p.x+(Math.random()<.5?-150:150))),Math.max(120,p.y-170)); let q2=addNode(Math.max(70,Math.min(730,q1.x+(Math.random()*90-45))),Math.max(70,q1.y-140));addEdge(attach,q1);addEdge(q1,q2);state.mainPaths.push([attach,q1,q2]);
}
function placeFacilities(){
 const must=['Main Gate','Car Park','Visitor Centre','Bike Hire'];
 let pools={activity:shuffle(libs.activity).slice(0,4),shop:shuffle(libs.shop).slice(0,4),living:shuffle(libs.living).slice(0,3),service:must,natural:['Lake','Picnic Park'],other:shuffle(libs.other).slice(0,2)};
 let names=[...pools.activity,...pools.shop,...pools.living,...pools.service,...pools.natural,...pools.other].slice(0,18);
 let occupied=[];
 function candidate(name,cat){
   if(name==='Main Gate')return {x:nearGridCenter(state.road[0].x,100),y:950};
   if(name==='Car Park')return {x:nearGridCenter(state.road[2].x+70,100),y:nearGridCenter(state.road[2].y,100)};
   if(name==='Visitor Centre')return {x:nearGridCenter(state.road[2].x-70,100),y:nearGridCenter(state.road[2].y-70,100)};
   if(name==='Lake'){let w=state.waters[0];return{x:nearGridCenter(w.x,100),y:nearGridCenter(w.y,100)}}
   let key=cat==='activity'?'activity':cat==='shop'?'shop':cat==='living'?'living':cat==='service'?'service':cat==='natural'?'water':'shop'; let z=state.zones[key]||[400,500];
   return{x:nearGridCenter(z[0]+(Math.random()*250-125),100),y:nearGridCenter(z[1]+(Math.random()*260-130),100)};
 }
 names.forEach((name,i)=>{
   let cat=categoryFor(name), pos=null;
   for(let t=0;t<120;t++){let c=candidate(name,cat);c.x=Math.max(50,Math.min(750,c.x));c.y=Math.max(50,Math.min(950,c.y));
     let pr=profileFor(name); let waterOK=(name==='Lake'||name==='Picnic Park')||!pointInWater(c.x,c.y,state.waters);
     let clear=occupied.every(o=>Math.abs(c.x-o.x)>(pr.w+(o.w||82))/2+12 || Math.abs(c.y-o.y)>(pr.h+(o.h||52))/2+12);
     if(waterOK&&clear){pos=c;break}
   }
   if(!pos){ // deterministic free-cell fallback
     outer: for(let r=0;r<10;r++)for(let c=0;c<8;c++){let x=c*100+50,y=r*100+50;if(!pointInWater(x,y,state.waters)&&occupied.every(o=>Math.hypot(x-o.x,y-o.y)>82)){pos={x,y};break outer}}
   }
   if(!pos)pos={x:50+(i%8)*100,y:50+Math.floor(i/8)*100}; let pr=profileFor(name); occupied.push({...pos,w:pr.w,h:pr.h});
   state.features.push({id:i,name,category:cat,x:pos.x,y:pos.y,grid:gridOf(pos.x,pos.y),w:pr.w,h:pr.h,size:pr.size,shape:pr.shape||'building',rot:['parking','field','tennis','pool','campsite','cluster'].includes(pr.shape)?0:Math.random()*8-4});
 });
}
function connectFacilities(){
 // feature entrance nodes are added, then connected to nearest path node; no universal hub
 const pathNodeCount=state.nodes.length;
 state.features.forEach((f,i)=>{
   let fid=addNode(f.x,f.y,'entrance');state.nodes[fid].feature=i; f.nodeId=fid;
   let candidates=state.nodes.slice(0,pathNodeCount).map(n=>({n,d:Math.hypot(f.x-n.x,f.y-n.y)})).sort((a,b)=>a.d-b.d);
   let target=candidates[0].n; addEdge(fid,target.id,'access');
 });
}
function buildBikeTrail(){
 let bike=state.features.find(f=>f.name==='Bike Hire'); if(!bike)return;
 let side=bike.x<400?1:-1, x2=Math.max(70,Math.min(730,bike.x+side*170));
 state.bikePath=[{x:bike.x,y:bike.y},{x:x2,y:Math.max(90,bike.y-180)},{x:400,y:Math.max(80,bike.y-300)},{x:720-bike.x/5,y:Math.min(930,bike.y+100)}];
}
function shortest(fi,fj){
 let n=state.nodes.length, adj=Array.from({length:n},()=>[]);
 for(const e of state.edges){let a=state.nodes[e.a],b=state.nodes[e.b],w=dist(a,b);adj[e.a].push([e.b,w]);adj[e.b].push([e.a,w])}
 let d=Array(n).fill(Infinity),used=Array(n).fill(false);d[fi]=0;
 for(let z=0;z<n;z++){let u=-1;for(let i=0;i<n;i++)if(!used[i]&&(u<0||d[i]<d[u]))u=i;if(u<0)break;used[u]=true;for(const[v,w]of adj[u])d[v]=Math.min(d[v],d[u]+w)}
 return d[fj];
}
function render(){
 let s=svgEl("svg",{viewBox:"-55 -55 910 1345","aria-label":"Generated map"});
 s.append(svgEl("rect",{x:0,y:0,width:W,height:H,fill:"#a9d875"}));
 for(const [x,y,w,h] of state.woods)s.append(svgEl("path",{d:`M${x},${y} Q${x+w*.75},${y+45} ${x+w*.55},${y+h*.35} Q${x+w*.25},${y+h*.65} ${x+w},${y+h} L${x},${y+h}Z`,fill:"#247b4d",opacity:".95"}));
 for(const w of state.waters)s.append(svgEl("path",{d:`M${w.x-w.rx} ${w.y} Q${w.x-w.rx*.7} ${w.y-w.ry} ${w.x} ${w.y-w.ry} Q${w.x+w.rx*.8} ${w.y-w.ry*.8} ${w.x+w.rx} ${w.y} Q${w.x+w.rx*.7} ${w.y+w.ry} ${w.x} ${w.y+w.ry} Q${w.x-w.rx*.9} ${w.y+w.ry*.7} ${w.x-w.rx} ${w.y}Z`,fill:"#bfe3ea",stroke:"#6fb7c5","stroke-width":2}));
 if(state.road.length){let d=state.road.map((p,i)=>(i?"L":"M")+p.x+" "+p.y).join(" ");s.append(svgEl("path",{d,fill:"none",stroke:"#d7d9d7","stroke-width":26,"stroke-linecap":"round","stroke-linejoin":"round"}));if(state.roadBranch&&state.roadBranch.length){let db=state.roadBranch.map((p,i)=>(i?"L":"M")+p.x+" "+p.y).join(" ");s.append(svgEl("path",{d:db,fill:"none",stroke:"#d7d9d7","stroke-width":18,"stroke-linecap":"round","stroke-linejoin":"round"}))}}
 for(const e of state.edges){let a=state.nodes[e.a],b=state.nodes[e.b];s.append(svgEl("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:"#ef9b32","stroke-width":e.kind==='access'?4.5:7,"stroke-linecap":"round"}))}
 if(state.bikePath.length){let d=state.bikePath.map((p,i)=>(i?"L":"M")+p.x+" "+p.y).join(" ");s.append(svgEl("path",{d,fill:"none",stroke:"#f3d83f","stroke-width":4,"stroke-dasharray":"13 9","stroke-linejoin":"round"}))}
 for(let x=0;x<=800;x+=100)s.append(svgEl("line",{x1:x,y1:0,x2:x,y2:1000,stroke:"#fff","stroke-opacity":.35,"stroke-width":1}));
 for(let y=0;y<=1000;y+=100)s.append(svgEl("line",{x1:0,y1:y,x2:800,y2:y,stroke:"#fff","stroke-opacity":.35,"stroke-width":1}));
 for(const f of state.features){
   let g=svgEl("g",{transform:`translate(${f.x} ${f.y})`}), shape=svgEl("g",{transform:`rotate(${f.rot})`});
   let fill=catColor[f.category],stroke="#526066";

 let old=svg.querySelector('[data-live-footpath="1"]');if(old)old.remove();
 let d=state.drawing.points.map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join(' ');
 svg.append(svgEl('path',{d,fill:'none',stroke:'#ef9b32','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none','data-live-footpath':'1'}));
}
function updateFootpathDrawing(e){
 if(state.appMode!=='builder'||!state.drawing||state.drawing.type!=='footpath'||!state.drawing.freehand||state.drawing.pointerId!==e.pointerId)return false;
 let svg=document.querySelector('#map svg');if(!svg)return false;e.preventDefault();let q=svgPoint(e,svg),pts=state.drawing.points,last=pts[pts.length-1];
 if(!last||Math.hypot(q.x-last.x,q.y-last.y)>=6){pts.push(q);overlayLiveFootpath(svg)}return true;
}
function endFootpathDrawing(e){
 if(state.appMode!=='builder'||!state.drawing||state.drawing.type!=='footpath'||!state.drawing.freehand)return false;
 if(e&&state.drawing.pointerId!==e.pointerId)return false;
 let pts=state.drawing.points,statePath={type:'footpath',points:pts.map(q=>({x:q.x,y:q.y}))};
 if(pts.length>1&&dist(pts[0],pts[pts.length-1])>=2)state.studentPaths.push(statePath);else state.studentHistory.pop();

}
function updateEditGesture(e){if(state.appMode!=='builder'||!state.editGesture)return;let svg=document.querySelector('#map svg');if(!svg)return;let g=state.editGesture,f=state.features.find(x=>x.id===g.id);if(!f)return;let q=svgPoint(e,svg),dx=q.x-g.startX,dy=q.y-g.startY;
 if(g.kind==='move'){
  f.x=clamp(g.orig.x+dx,f.w/2,800-f.w/2);f.y=clamp(g.orig.y+dy,f.h/2,1000-f.h/2);f.grid=gridOf(f.x,f.y);
 }else{
  const minW=40,minH=30;let left=g.orig.x-g.orig.w/2,right=g.orig.x+g.orig.w/2,top=g.orig.y-g.orig.h/2,bottom=g.orig.y+g.orig.h/2;
  if(g.corner.includes('l'))left=clamp(left+dx,0,right-minW);else right=clamp(right+dx,left+minW,800);
  if(g.corner.includes('t'))top=clamp(top+dy,0,bottom-minH);else bottom=clamp(bottom+dy,top+minH,1000);
  f.w=right-left;f.h=bottom-top;f.x=(left+right)/2;f.y=(top+bottom)/2;f.grid=gridOf(f.x,f.y);
 }
 builderRender();
}

// Grid references: eastings first, northings second.
// Student missions may provide a dynamic numerical origin; Teacher Mode keeps the original defaults.
function currentBuilderGridOrigin(){
 const g=state.missionGrid||{};
 return {easting:Number.isFinite(+g.easting)?+g.easting:20,northingTop:Number.isFinite(+g.northingTop)?+g.northingTop:40};
}
function builderGridRef(x,y,mode=state.builderGridMode){
 x=Math.max(0,Math.min(799.999,x));y=Math.max(0,Math.min(999.999,y));
 if(mode==='letters')return gridOf(x,y);
 const col=Math.floor(x/100), northPos=1000-y, row=Math.min(9,Math.floor(northPos/100));
 const origin=currentBuilderGridOrigin(), e=origin.easting+col, n=(origin.northingTop-10)+row;
 if(mode==='four')return String(e).padStart(2,'0')+String(n).padStart(2,'0');
 const et=Math.min(9,Math.floor((x-col*100)/10)), nt=Math.min(9,Math.floor((northPos-row*100)/10));
 return String(e).padStart(2,'0')+et+String(n).padStart(2,'0')+nt;
}
function applyBuilderGridVisuals(s){
 if(state.builderGridMode==='letters')return;
 // Hide A-H and 1-10 coordinate labels only; preserve labels inside the map.
 [...s.querySelectorAll('text')].forEach(t=>{let tx=(t.textContent||'').trim(),x=+t.getAttribute('x'),y=+t.getAttribute('y');if((y===-14||y===1025)&&/^[A-H]$/.test(tx))t.setAttribute('display','none');if((x===-18||x===820)&&/^(10|[1-9])$/.test(tx))t.setAttribute('display','none')});
 // Easting labels belong to vertical grid lines; northings increase upwards.
 // 4-figure mode shows two-digit grid-line labels (20, 21 ... / 40, 39 ...).
 // 6-figure mode shows the same grid lines at 10 m precision (200, 210 ... / 400, 390 ...),
 // so the border notation visually matches genuine three-digit eastings/northings.
 const sixFigureLabels=state.builderGridMode==='six',origin=currentBuilderGridOrigin();
 for(let i=0;i<=8;i++)for(const y of[-14,1025]){let t=svgEl('text',{x:i*100,y,'text-anchor':'middle','font-size':13,'font-weight':800,'data-builder-grid':'1'});let base=origin.easting+i;t.textContent=sixFigureLabels?base*10:base;s.append(t)}
 for(let i=0;i<=10;i++){let base=origin.northingTop-i,num=sixFigureLabels?base*10:base;for(const x of[-18,820]){let t=svgEl('text',{x,y:i*100+5,'text-anchor':'middle','font-size':13,'font-weight':800,'data-builder-grid':'1'});t.textContent=num;s.append(t)}}
}

// ===== Student Map Builder v7.1 — robust rename / Delete / Undo workflow =====
// Replace the original name input node so the earlier change listener cannot create
// duplicate/inconsistent history entries. A completed edit (blur/Enter) is one action.
(function(){
  const oldInput=document.getElementById('builderObjectName');
  if(!oldInput)return;
  const nameInput=oldInput.cloneNode(true);
  oldInput.replaceWith(nameInput);
  let edit=null;

  function beginNameEdit(){
    const f=selectedBuilderFeature();
    if(!f)return;
    if(!f.baseType)f.baseType=f.name;
    if(f.displayName===undefined)f.displayName=f.name;
    edit={id:f.id,before:f.displayName};
  }
  function commitNameEdit(){
    if(!edit)return;
    const id=edit.id, before=edit.before, value=nameInput.value;
    const f=state.features.find(x=>x.id===id);
    edit=null;
    if(!f)return;
    // Only create history when the completed value actually changed.
    if(value!==before){
      // Push a snapshot containing the PRE-EDIT value.
      const current=f.displayName;
      f.displayName=before;
      pushHistory();
      f.displayName=current;
      f.baseType=f.baseType||f.name;
      f.displayName=value; // empty string intentionally means no label
    }
    state.selectedFeatureId=id; // renaming must never lose the selection
    builderRender();
  }
  function cancelNameEdit(){
    if(!edit)return;
    const id=edit.id, before=edit.before;
    edit=null;
    const f=state.features.find(x=>x.id===id);
    if(f){f.displayName=before;state.selectedFeatureId=id;}
    builderRender();
  }

  nameInput.addEventListener('focus',beginNameEdit);
  nameInput.addEventListener('input',()=>{
    // Live visual update without writing a history entry for every keystroke.
    if(!edit)beginNameEdit();
    const f=edit&&state.features.find(x=>x.id===edit.id);
    if(f){f.baseType=f.baseType||f.name;f.displayName=nameInput.value;}
  });
  nameInput.addEventListener('blur',commitNameEdit);
  nameInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();nameInput.blur();return;}
    if(e.key==='Escape'){e.preventDefault();cancelNameEdit();nameInput.blur();return;}
    // While typing, Ctrl/Cmd+Z remains the browser/text-field undo as expected.
    // Map-level Undo resumes after Enter or blur.
  });

// ===== Student Map Builder v7.2 — clean manual Car Route junctions =====
// Targeted Student Builder-only visual joining. Roads remain independent state objects.
(function(){
  const ROAD_SNAP=18;
  function d2(a,b){const x=a.x-b.x,y=a.y-b.y;return x*x+y*y}
  function projectToSegment(p,a,b){
    const vx=b.x-a.x,vy=b.y-a.y,den=vx*vx+vy*vy||1;
    let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/den;t=Math.max(0,Math.min(1,t));
    return {x:a.x+t*vx,y:a.y+t*vy,t};
  }
  function roadSnapTarget(q,exclude){
    let best=null,bestD=ROAD_SNAP*ROAD_SNAP;
    for(const r of state.studentPaths.filter(x=>x.type==='road'&&x!==exclude&&x.points&&x.points.length>1)){
      const ends=[r.points[0],r.points[r.points.length-1]];
      for(const e of ends){const dd=d2(q,e);if(dd<bestD){bestD=dd;best={x:e.x,y:e.y,kind:'endpoint'}}}
      for(let i=0;i<r.points.length-1;i++){
        const z=projectToSegment(q,r.points[i],r.points[i+1]),dd=d2(q,z);
        if(dd<bestD){bestD=dd;best={x:z.x,y:z.y,kind:'segment'}}
      }
    }
    return best;
  }
  function roadJunctions(roads){
    const js=[];const add=q=>{if(!js.some(x=>d2(x,q)<16))js.push({x:q.x,y:q.y})};
    for(let i=0;i<roads.length;i++)for(let j=i+1;j<roads.length;j++){
      const a=roads[i],b=roads[j],ae=[a.points[0],a.points[a.points.length-1]],be=[b.points[0],b.points[b.points.length-1]];
      for(const p of ae)for(const q of be)if(d2(p,q)<=ROAD_SNAP*ROAD_SNAP)add({x:(p.x+q.x)/2,y:(p.y+q.y)/2});
      // Endpoint-to-middle T junctions.
      for(const p of ae)for(let k=0;k<b.points.length-1;k++){const z=projectToSegment(p,b.points[k],b.points[k+1]);if(d2(p,z)<=64)add(z)}
      for(const p of be)for(let k=0;k<a.points.length-1;k++){const z=projectToSegment(p,a.points[k],a.points[k+1]);if(d2(p,z)<=64)add(z)}
    }
    return js;
  }

  // Snap only the finishing point of a manually drawn road. Other route types are untouched.
  const previousEnd=endFootpathDrawing;
  endFootpathDrawing=function(e){
    if(state.appMode==='builder'&&state.drawing&&state.drawing.type==='road'&&(!e||state.drawing.pointerId===e.pointerId)){
      const pts=state.drawing.points;
      if(pts&&pts.length>1){const hit=roadSnapTarget(pts[pts.length-1],null);if(hit)pts[pts.length-1]={x:hit.x,y:hit.y}}
    }
    return previousEnd(e);
  };

  // One network renderer: all borders first, then merged junctions/surfaces, then centre markings.
  overlayStudent=function(){
    const s=document.querySelector('#map svg');if(!s)return;
    const anchor=s.querySelector('line[stroke-opacity]');
    [...s.querySelectorAll('[data-v5-road],[data-v7-road],[data-v72-road-network]')].forEach(n=>n.remove());

    // Keep non-road Student Builder routes exactly as before.
    for(const p of state.studentPaths.filter(p=>p.type!=='road')){
      if(!p.points||p.points.length<2)continue;
      const st=routeStyle(p.type),d=builderPathD(p.points,p.style||'freehand');
      const el=svgEl('path',{d,fill:'none',stroke:st.stroke,'stroke-width':st.width,'stroke-dasharray':st.dash,'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'none','clip-path':'url(#builderMapClip)'});
      if(anchor)s.insertBefore(el,anchor);else s.append(el);
    }

    const roads=state.studentPaths.filter(p=>p.type==='road'&&p.points&&p.points.length>1);
    if(roads.length){
      const net=svgEl('g',{'data-v72-road-network':'1','pointer-events':'none','clip-path':'url(#builderMapClip)'});
      const border=svgEl('g',{}),surface=svgEl('g',{}),centre=svgEl('g',{});
      for(const r of roads){
        const d=builderPathD(r.points,r.style||'freehand'),common={d,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
        border.append(svgEl('path',{...common,stroke:'#343a3d','stroke-width':20}));
        surface.append(svgEl('path',{...common,stroke:'#d7d9d7','stroke-width':15}));
        centre.append(svgEl('path',{...common,stroke:'#ffffff','stroke-width':2.2,'stroke-dasharray':'11 10'}));
      }
      // Junction discs are exactly road-width, so they merge caps without creating oversized bulbs.
      for(const j of roadJunctions(roads))border.append(svgEl('circle',{cx:j.x,cy:j.y,r:10,fill:'#343a3d'}));
      for(const j of roadJunctions(roads))surface.append(svgEl('circle',{cx:j.x,cy:j.y,r:7.5,fill:'#d7d9d7'}));
      net.append(border);net.append(surface);net.append(centre);
      if(anchor)s.insertBefore(net,anchor);else s.append(net);
    }
    if(state.drawing&&state.drawing.points.length)overlayLiveFootpath(s);
    [...s.querySelectorAll('g')].forEach(g=>{let t=g.querySelector('text');if(t&&state.features.some(f=>f.name===t.textContent||[...t.querySelectorAll('tspan')].map(x=>x.textContent).join(' ')===f.name))g.classList.add('student-feature')});
  };
})();

(function(){

  `;

  const title=document.createElement('h3');title.textContent='YOUR MISSION';
  const newBtn=document.createElement('button');newBtn.type='button';newBtn.id='newMissionV10';newBtn.className='no-print';newBtn.textContent='NEW MISSION';
  head.append(title,newBtn);

  const pickV10=a=>a[Math.floor(Math.random()*a.length)];
  const shuffleV10=a=>a.slice().sort(()=>Math.random()-.5);
  const directionsV10=['north','north-east','east','south-east','south','south-west','west','north-west'];
  const foodV10=['Café','Restaurant','Bakery','Gift Shop','Supermarket','Bike Shop'];
  const accommodationV10=['Hotel','Hostel','Cottages','Cabins','Campsite'];
  const activityV10=['Playground','Tennis Courts','Basketball Court','Mini Golf','Swimming Pool','Football Field','Adventure Park'];
  const naturalV10=['Lake','Duck Pond','Meadow','Woodland'];
  const servicesV10=['Bike Hire','Boat Hire','Bus Stop'];
  const escMissionV10=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const boldV10=v=>`<b>${escMissionV10(v)}</b>`;

  function cellV10(){return String.fromCharCode(65+Math.floor(Math.random()*8))+(1+Math.floor(Math.random()*10))}
  function pointForCellV10(cell){const col=cell.charCodeAt(0)-65,num=parseInt(cell.slice(1),10);return{x:col*100+50,y:(10-num)*100+50}}
  function locationRefV10(){
    if(state.builderGridMode==='letters')return cellV10();
    const c=cellV10(),p=pointForCellV10(c);
    if(state.builderGridMode==='six'){p.x+=pickV10([-20,-10,0,10,20]);p.y+=pickV10([-20,-10,0,10,20])}
    return builderGridRef(p.x,p.y,state.builderGridMode);
  }
  function contiguousCellsV10(){
    const col=Math.floor(Math.random()*7),row=Math.floor(Math.random()*9),A=String.fromCharCode(65+col),B=String.fromCharCode(66+col),n=10-row,m=9-row;
    return [`${A}${n}`,`${B}${n}`,`${A}${m}`,`${B}${m}`];
  }
  function mapHasStudentWorkV10(){return !!((state.features&&state.features.length)||(state.studentPaths&&state.studentPaths.length)||(state.woods&&state.woods.length)||(state.waters&&state.waters.length))}

  function generateMissionV10(){
    const food=pickV10(foodV10),accom=pickV10(accommodationV10),activity=pickV10(activityV10),nature=pickV10(naturalV10),service=pickV10(servicesV10);
    const d1=pickV10(directionsV10),d2=pickV10(directionsV10.filter(x=>x!==d1));
    const scale=Number(document.getElementById('builderScale')?.value||state.scale||20);
    const distances=[20,40,50,60,80,100,120].filter(x=>x<=Math.max(60,scale*6));
    const metres=pickV10(distances.length?distances:[20,40,60]);
    const items=[];

    // Establish reference features first; later instructions only depend on these already-introduced objects.
    items.push(`Place the ${boldV10('Visitor Centre')} at grid reference ${boldV10(locationRefV10())}.`);
    items.push(`Place the ${boldV10('Main Gate')} at grid reference ${boldV10(locationRefV10())}.`);

    if(state.builderGridMode==='letters' && (nature==='Lake'||nature==='Duck Pond'||nature==='Meadow')){
      const cells=contiguousCellsV10();
      items.push(`Create a ${boldV10(nature)} covering grid squares ${cells.map(boldV10).join(', ')}.`);

      `Place the ${boldV10(activity)} ${boldV10(pickV10(directionsV10))} of the ${boldV10(food)}.`
    ];
    items.push(pickV10(finalChoices));
    return items;

  function resumeAfterCompletionV10(){

    },1000);
  }
  function replaceMissionV10(){
    if(mapHasStudentWorkV10()&&!confirm('Generate a new mission?\n\nYour current map will remain, but the mission instructions will change.'))return;
    resumeAfterCompletionV10();

    const nat=take(pools.natural); if(!nat||!addNaturalV17(plan,items,nat))return null;

    if(level===1){
      const food=take(pools.food), acc=take(pools.accommodation);
      if(!addRelativeV17(plan,items,food,'Visitor Centre',card,[1,2,3],false))return null;
      if(!addRelativeV17(plan,items,acc,'Visitor Centre',card,[1,2,3],true))return null;
      routeV17(items,'Footpath','Main Gate','Visitor Centre');
    }else if(level===2){
      const food=take(pools.food),acc=take(pools.accommodation),act=take(pools.activity),svc=take(pools.services);
      if(!addRelativeV17(plan,items,food,'Visitor Centre',all,cms,false))return null;
      if(!addRelativeV17(plan,items,acc,'Visitor Centre',all,cms,true))return null;
      if(!addRelativeV17(plan,items,act,food,all,[1.5,2,2.5],false))return null;
      if(!addRelativeV17(plan,items,svc,'Main Gate',all,[1,1.5,2],false))return null;
      routeV17(items,'Footpath','Main Gate','Visitor Centre');
      routeV17(items,svc==='Bike Hire'?'Bike Trail':'Footpath',svc,act);
    }else{
      const acc=take(pools.accommodation),food=take(pools.food),act1=take(pools.activity),act2=take(pools.activity),svc=take(pools.services),food2=take(pools.food);
      if(!addRelativeV17(plan,items,acc,'Visitor Centre',all,cms,true))return null;
      if(!addRelativeV17(plan,items,food,acc,all,[1.5,2,2.5,3],true))return null;
      if(!addRelativeV17(plan,items,act1,food,all,[1.5,2,2.5],false))return null;
      if(!addRelativeV17(plan,items,svc,'Main Gate',all,[1,1.5,2],false))return null;
      if(!addRelativeV17(plan,items,act2,'Visitor Centre',all,[2,2.5,3],true))return null;
      // A second natural/food feature adds complexity without making the map impossible.
      const nat2=take(pools.natural);
      if(nat2 && addNaturalV17(plan,items,nat2)){}
      else if(food2) addRelativeV17(plan,items,food2,'Visitor Centre',all,[1.5,2],false);
      // Logical route mix.
      routeV17(items,'Car Route','Main Gate','Visitor Centre');
      routeV17(items,'Footpath','Visitor Centre',acc);
      routeV17(items,'Footpath',acc,food);
      if(svc==='Bike Hire')routeV17(items,'Bike Trail','Bike Hire',act1);
      else routeV17(items,'Bike Trail','Visitor Centre',act1);
    }
    return {items,plan};
  }
  function fallbackMissionV17(level){
    // Safe central fallback: still respects current grid/scale/north.
    const plan={},items=[];
    plan['Visitor Centre']={name:'Visitor Centre',x:400,y:500};
    plan['Main Gate']={name:'Main Gate',x:400,y:850};
    items.push(`Place the ${bold17('Visitor Centre')} at ${refLabel()}${bold17(refForPointV17(plan['Visitor Centre']))}.`);
    items.push(`Place the ${bold17('Main Gate')} at ${refLabel()}${bold17(refForPointV17(plan['Main Gate']))}.`);
    plan['Meadow']={name:'Meadow',x:180,y:220};
    items.push(`Create a ${bold17('Meadow')} around ${refLabel()}${bold17(refForPointV17(plan['Meadow']))}.`);
    const names=level===1?['Café','Hotel']:level===2?['Café','Hotel','Playground','Bike Hire']:['Hotel','Café','Playground','Bike Hire','Tennis Courts','Restaurant'];
    const desired=level===1?6:level===2?9:12;
    const dirs=level===1?['N','E','S','W']:compassOrder;
    let base='Visitor Centre';
    for(const n of names){
      if(items.length>=desired-(level===3?4:level===2?2:1))break;
      if(!addRelativeV17(plan,items,n,base,dirs,level===1?[1,2]:[1.5,2,2.5],n==='Hotel'||n==='Tennis Courts'))continue;
      base=n;
    }
    routeV17(items,'Footpath','Main Gate','Visitor Centre');
    if(level>=2)routeV17(items,'Bike Trail','Visitor Centre',plan['Playground']?'Playground':base);
    if(level>=3){routeV17(items,'Car Route','Main Gate','Visitor Centre');routeV17(items,'Footpath','Visitor Centre','Hotel')}
    return {items,plan};
  }
  function generateMissionV17(){
    for(let attempt=0;attempt<120;attempt++){
      const built=buildMissionPlanV17(state.missionLevel);
      const target=state.missionLevel===1?[5,6]:state.missionLevel===2?[7,9]:[10,13];
      if(built&&built.items.length>=target[0]&&built.items.length<=target[1]){
        state.missionPlan=built.plan; return built.items;
      }
    }
    const f=fallbackMissionV17(state.missionLevel);state.missionPlan=f.plan;return f.items;
  }

  function renderMissionMetaV17(){
    const meta=document.getElementById('missionMetaV15'); if(!meta)return;
    meta.innerHTML=`<span class="mission-chip">${levelNames[state.missionLevel]}</span><span class="mission-chip">SCALE: 1 cm = ${state.missionScale} m</span><span class="mission-chip">CHECK THE COMPASS — North may not be at the top!</span>`;
  }
  function renderMissionV17(){
    renderMissionMetaV17();
    missionList.innerHTML=(state.studentMission||[]).map(x=>`<li>${x}</li>`).join('');
  }

  // ---------- Ruler ----------
  function rulerScaleV17(){return Number(state.missionScale||builderScale.value||state.scale||20)}
  function updateRulerReadoutV17(){
    if(!rulerReadout)return;
    const r=state.rulerMeasurement||state.rulerDrawing;
    if(!r||!r.start||!r.end){rulerReadout.textContent='Drag across the map to measure distance.';return}
    const cm=Math.hypot(r.end.x-r.start.x,r.end.y-r.start.y)/100, metres=cm*rulerScaleV17();
    rulerReadout.textContent=`${cm.toFixed(1)} cm = ${metres.toFixed(1).replace(/\.0$/,'')} m`;
  }
  function drawRulerV17(){
    if(state.appMode!=='builder')return; const s=document.querySelector('#map svg');if(!s)return;
    s.querySelectorAll('[data-ruler-v17]').forEach(x=>x.remove());
    const r=state.rulerDrawing||state.rulerMeasurement;if(!r||!r.start||!r.end)return;
    const a=r.start,b=r.end,cm=Math.hypot(b.x-a.x,b.y-a.y)/100,metres=cm*rulerScaleV17();
    const g=svgEl('g',{'data-ruler-v17':'1','pointer-events':'none'});
    g.append(svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'ruler-line-v17'}));
    g.append(svgEl('circle',{cx:a.x,cy:a.y,r:7,class:'ruler-end-v17'}));
    g.append(svgEl('circle',{cx:b.x,cy:b.y,r:7,class:'ruler-end-v17'}));
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2-10,t=svgEl('text',{x:mx,y:my,'text-anchor':'middle',class:'ruler-label-v17'});
    t.textContent=`${cm.toFixed(1)} cm = ${metres.toFixed(1).replace(/\.0$/,'')} m`;g.append(t);s.append(g);
  }
  function installRulerEventsV17(){
    const s=document.querySelector('#map svg');if(!s||s.dataset.rulerBoundV17)return;s.dataset.rulerBoundV17='1';
    s.addEventListener('pointerdown',e=>{
      if(state.appMode!=='builder'||state.builderTool!=='ruler')return;
      e.preventDefault();e.stopImmediatePropagation();
      const q=svgPoint(e,s);state.rulerMeasurement=null;state.rulerDrawing={start:q,end:q,pointerId:e.pointerId};
      try{s.setPointerCapture(e.pointerId)}catch(_){}
      updateRulerReadoutV17();drawRulerV17();
    },true);
  }
  window.addEventListener('pointermove',e=>{
    const r=state.rulerDrawing;if(!r||r.pointerId!==e.pointerId||state.builderTool!=='ruler')return;
    const s=document.querySelector('#map svg');if(!s)return;e.preventDefault();r.end=svgPoint(e,s);updateRulerReadoutV17();drawRulerV17();
  },{passive:false});
  window.addEventListener('pointerup',e=>{
    const r=state.rulerDrawing;if(!r||r.pointerId!==e.pointerId)return;
    state.rulerMeasurement={start:{...r.start},end:{...r.end}};state.rulerDrawing=null;updateRulerReadoutV17();drawRulerV17();
  });

  rulerBtn.onclick=()=>{
    state.builderTool='ruler';state.drawing=null;state.selectedFeatureId=null;
    document.querySelectorAll('.builder-only .toolbtn').forEach(x=>x.classList.remove('on'));
    rulerBtn.classList.add('on');builderRender();
  };
  clearRuler.onclick=()=>{state.rulerMeasurement=null;state.rulerDrawing=null;updateRulerReadoutV17();drawRulerV17()};

  // ---------- Printing ----------
  function gridLabelV17(){return state.builderGridMode==='four'?'4-Figure Grid Reference':state.builderGridMode==='six'?'6-Figure Grid Reference':'Letters & Numbers'}
  function refreshPrintV17(){
    const pm=document.getElementById('studentPrintMission');if(!pm)return;
    const oldImg=pm.querySelector('img')?.getAttribute('src')||'';
    const n=state.studentIdentity?.name||'',no=state.studentIdentity?.number||'';
    const elapsed=typeof formatElapsed==='function'?formatElapsed(state.studentElapsed):String(state.studentElapsed||'');
    pm.innerHTML=`${oldImg?`<img src="${oldImg}" alt="King's College International School, Wuxi">`:''}<h2>MAP SKILLS — STUDENT MISSION</h2>
      <div class="print-id"><b>Student Name:</b> ${esc17(n)} &nbsp;&nbsp; <b>Student Number:</b> ${esc17(no)} &nbsp;&nbsp; <b>Completion Time:</b> ${elapsed}<br>
      <b>Mission Level:</b> ${levelNames[state.missionLevel]} &nbsp;&nbsp; <b>Scale:</b> 1 cm = ${state.missionScale||state.scale||20} m &nbsp;&nbsp; <b>Grid Reference:</b> ${gridLabelV17()}</div>
      <h3>YOUR MISSION</h3><ol>${(state.studentMission||[]).map(x=>`<li>${x}</li>`).join('')}</ol>`;
  }

  // ---------- Integrate after v15 without touching Teacher Mode ----------
  const baseRenderV17=builderRender;
  builderRender=function(){
    baseRenderV17();
    if(state.appMode==='builder'){
      renderMissionMetaV17();installRulerEventsV17();drawRulerV17();updateRulerReadoutV17();
    }
  };

  function regenerateV17(changeSettings=true){
    if(changeSettings){
      // v15 NEW MISSION settings are reproduced here so the selected level is preserved.
      const oldN=state.missionNorth, oldS=Number(state.missionScale);
      const ns=compassOrder.filter(x=>x!==oldN);state.missionNorth=pick17(ns.length?ns:compassOrder);
      const ss=[10,20,50].filter(x=>x!==oldS);state.missionScale=pick17(ss.length?ss:[10,20,50]);
      if(typeof state.missionGrid!=='object')state.missionGrid={easting:20,northingTop:40};
      let prev=state.missionGrid,tries=0,e,n;
      do{e=10+Math.floor(Math.random()*61);n=30+Math.floor(Math.random()*61);tries++}while(tries<30&&e===prev.easting&&n===prev.northingTop);
      state.missionGrid={easting:e,northingTop:n};builderScale.value=String(state.missionScale);state.scale=state.missionScale;
    }
    state.studentMission=generateMissionV17();renderMissionV17();state.rulerMeasurement=null;state.rulerDrawing=null;builderRender();
  }

  // Replace v15 NEW MISSION in capture phase, while preserving its confirmation semantics.
  newBtn.addEventListener('click',e=>{
    e.preventDefault();e.stopImmediatePropagation();
    const hasWork=!!((state.features&&state.features.length)||(state.studentPaths&&state.studentPaths.length)||(state.woods&&state.woods.length)||(state.waters&&state.waters.length));
    if(hasWork&&!confirm('Generate a new mission?\n\nYour current map will remain, but the mission instructions, scale, compass orientation and grid numbering will change.'))return;
    if(state.studentCompleted){document.body.classList.remove('student-completed');state.studentCompleted=false}
    regenerateV17(true);
  },true);

  levelSelect.addEventListener('change',e=>{
    const next=Number(e.target.value)||1;if(next===state.missionLevel)return;
    const hasWork=!!((state.features&&state.features.length)||(state.studentPaths&&state.studentPaths.length)||(state.woods&&state.woods.length)||(state.waters&&state.waters.length));
    if(hasWork&&!confirm('Change mission level?\n\nYour current map will remain, but a new mission will be generated.')){e.target.value=String(state.missionLevel);return}
    state.missionLevel=next;regenerateV17(false);
  });

  // Regenerate with the current level when grid mode changes, after v15 has updated the mode.
  document.getElementById('builderGridMode')?.addEventListener('change',()=>{
    setTimeout(()=>{state.studentMission=generateMissionV17();renderMissionV17();builderRender()},0);
  });

  // Make print include mission level and exclude ruler/selection overlays.
  const printBtn=document.getElementById('printMap');
  if(printBtn)printBtn.onclick=()=>{
    if(!state.studentCompleted)return;
    refreshPrintV17();let saved=state.selectedFeatureId,tool=state.builderTool,r=state.rulerMeasurement;
    state.selectedFeatureId=null;state.rulerMeasurement=null;state.rulerDrawing=null;builderRender();
    setTimeout(()=>{print();state.selectedFeatureId=saved;state.builderTool=tool;state.rulerMeasurement=r;builderRender()},50);
  };
  document.getElementById('checkBuilder')?.addEventListener('click',()=>setTimeout(refreshPrintV17,0));

  // First v17 mission: preserve current v15 scale/north/grid, upgrade only mission structure.
  state.studentMission=generateMissionV17();renderMissionV17();builderRender();
})();

</script>
</body></html>
